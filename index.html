    <script>
      // Early protection against benign browser ResizeObserver notifications and iframe script errors
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || '';
        if (
          msg === 'ResizeObserver loop completed with undelivered notifications.' ||
          msg === 'ResizeObserver loop limit exceeded' ||
          msg.indexOf('ResizeObserver') !== -1 ||
          (msg === 'Script error.' && !e.filename)
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>
